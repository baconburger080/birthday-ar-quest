<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Birthday AR Quest</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

    <!-- Zappar Universal AR JavaScript SDK -->
    <script src="https://libs.zappar.com/zappar-js/*/zappar.js"></script>

</head>


<body>


    <!-- ========================================= -->
    <!-- INTRO -->
    <!-- ========================================= -->

    <section id="intro-screen">

        <div class="pixel-frame">

            <div class="game-title">

                BIRTHDAY
                <br>
                AR QUEST

            </div>

            <div class="game-subtitle">

                FIND THE BIRTHDAY WISHES

            </div>

            <div class="message-box">

                <p class="hello">
                    HELLO, BABY.
                </p>

                <p>
                    วันนี้เป็นวันเกิดของเธอ
                </p>

                <p>
                    แต่เธอจะต้องตามหาของขวัญด้วยตัวเอง
                </p>

                <p>
                    มีของขวัญชิ้นหนึ่งถูกซ่อนเอาไว้
                    <br>
                    และมีเพียงเธอเท่านั้นที่จะหาเจอ
                </p>

            </div>

            <button id="startButton">
                ARE YOU READY?
            </button>

        </div>

    </section>



    <!-- ========================================= -->
    <!-- LEVEL 1 -->
    <!-- ========================================= -->

    <section
        id="level1-screen"
        class="hidden"
    >

        <div class="pixel-frame">

            <div class="level-number">
                LEVEL 1
            </div>

            <div class="level-title">
                FIND THE WISHES
            </div>

            <div class="heart-counter">

                ♡

                <span id="heartCount">
                    0
                </span>

                /3

            </div>

            <p class="level-instruction">
                FIND THE HIDDEN WISHES
            </p>

            <p class="level-description">
                Point your camera at the ground.
            </p>

            <button id="startARButton">
                START AR
            </button>

        </div>

    </section>



    <!-- ========================================= -->
    <!-- AR SCREEN -->
    <!-- ========================================= -->

    <div
        id="ar-screen"
        class="hidden"
    >

        <!-- WebGL Canvas -->
        <canvas id="ar-canvas"></canvas>


        <!-- AR UI -->

        <div id="ar-ui">

            <div id="ar-message">
                SCAN THE GROUND
            </div>


            <div id="placement-dot">
                +
            </div>


            <button id="place-button">

                TAP TO PLACE

            </button>

        </div>

    </div>



    <!-- ========================================= -->
    <!-- GAME JAVASCRIPT -->
    <!-- ========================================= -->

    <script src="script.js"></script>

</body>

</html>
