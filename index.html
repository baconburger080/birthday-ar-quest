<!DOCTYPE html>
<html lang="en">

<head>

    <!-- ========================================= -->
    <!-- BASIC SETTINGS                            -->
    <!-- ========================================= -->

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Birthday AR Quest</title>


    <!-- ========================================= -->
    <!-- CSS                                       -->
    <!-- ========================================= -->

    <link
        rel="stylesheet"
        href="style.css"
    >


    <!-- ========================================= -->
    <!-- ZAPPAR UNIVERSAL AR SDK                   -->
    <!-- ========================================= -->

    <script
        src="https://libs.zappar.com/zappar-js/*/zappar.js">
    </script>

</head>


<body>


    <!-- ========================================= -->
    <!-- INTRO SCREEN                              -->
    <!-- ========================================= -->

    <section id="intro-screen">

        <div class="pixel-frame">


            <!-- GAME TITLE -->

            <div class="game-title">

                BIRTHDAY
                <br>
                AR QUEST

            </div>


            <!-- GAME SUBTITLE -->

            <div class="game-subtitle">

                FIND THE BIRTHDAY WISHES

            </div>


            <!-- MESSAGE -->

            <div class="message-box">

                <p class="hello">

                    HELLO, BABY.

                </p>


                <p>

                    วันนี้เป็นวันเกิดของเธอ

                </p>


                <p>

                    แต่เธอจะต้องตามหาของขวัญด้วยตัวเอง

                </p>


                <p>

                    มีของขวัญชิ้นหนึ่งถูกซ่อนเอาไว้
                    <br>
                    และมีเพียงเธอเท่านั้นที่จะหาเจอ

                </p>

            </div>


            <!-- START GAME -->

            <button id="startButton">

                ARE YOU READY?

            </button>


        </div>

    </section>



    <!-- ========================================= -->
    <!-- LEVEL 1 SCREEN                            -->
    <!-- ========================================= -->

    <section
        id="level1-screen"
        class="hidden"
    >

        <div class="pixel-frame">


            <!-- LEVEL NUMBER -->

            <div class="level-number">

                LEVEL 1

            </div>


            <!-- LEVEL TITLE -->

            <div class="level-title">

                FIND THE WISHES

            </div>


            <!-- HEART COUNTER -->

            <div class="heart-counter">

                ♡

                <span id="heartCount">

                    0

                </span>

                /3

            </div>


            <!-- INSTRUCTION -->

            <p class="level-instruction">

                SCAN THE AREA

            </p>


            <!-- DESCRIPTION -->

            <p class="level-description">

                Find the hidden wishes...

            </p>


            <!-- START AR -->

            <button id="startARButton">

                START AR

            </button>


        </div>

    </section>



    <!-- ========================================= -->
    <!-- AR SCREEN                                 -->
    <!-- ========================================= -->

    <div
        id="ar-screen"
        class="hidden"
    >


        <!-- ===================================== -->
        <!-- WEBGL CAMERA CANVAS                   -->
        <!-- ===================================== -->

        <canvas
            id="ar-canvas"
        ></canvas>



        <!-- ===================================== -->
        <!-- AR UI                                 -->
        <!-- ===================================== -->

        <div id="ar-ui">


            <!-- ================================= -->
            <!-- SCAN MESSAGE                      -->
            <!-- ================================= -->

            <div id="ar-message">

                SCAN THE GROUND

            </div>



            <!-- ================================= -->
            <!-- CENTER MARKER                     -->
            <!-- ================================= -->

            <div id="placement-dot">

                +

            </div>



            <!-- ================================= -->
            <!-- PLACE BUTTON                      -->
            <!-- ================================= -->

            <button
                id="place-button"
                type="button"
            >

                TAP TO PLACE

            </button>


        </div>


    </div>



    <!-- ========================================= -->
    <!-- JAVASCRIPT                               -->
    <!-- ========================================= -->

    <script src="script.js"></script>


</body>

</html>
