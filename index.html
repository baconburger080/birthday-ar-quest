<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <title>Birthday AR Quest</title>


    <!-- ===================================== -->
    <!-- CSS                                   -->
    <!-- ===================================== -->

    <link
        rel="stylesheet"
        href="style.css"
    >


    <!-- ===================================== -->
    <!-- ZAPPAR SDK                            -->
    <!-- ===================================== -->

    <script src="https://libs.zappar.com/zappar-js/4.4.0/zappar.js"></script>

</head>


<body>


    <!-- ===================================== -->
    <!-- INTRO SCREEN                          -->
    <!-- ===================================== -->

    <section id="intro-screen">

        <div class="pixel-frame">


            <div class="game-title">

                BIRTHDAY
                <br>
                AR QUEST

            </div>


            <div class="game-subtitle">

                FIND THE BIRTHDAY WISHES

            </div>


            <div class="message-box">

                <p class="hello">

                    HELLO, BABY.

                </p>


                <p>

                    วันนี้เป็นวันเกิดของเธอ

                </p>


                <p>

                    แต่เธอจะต้องตามหาของขวัญด้วยตัวเอง

                </p>


                <p>

                    มีของขวัญชิ้นหนึ่งถูกซ่อนเอาไว้

                    <br>

                    และมีเพียงเธอเท่านั้นที่จะหาเจอ

                </p>

            </div>


            <button
                id="startButton"
                type="button"
            >

                ARE YOU READY?

            </button>

        </div>

    </section>



    <!-- ===================================== -->
    <!-- LEVEL 1 SCREEN                        -->
    <!-- ===================================== -->

    <section
        id="level1-screen"
        class="hidden"
    >

        <div class="pixel-frame">


            <div class="level-number">

                LEVEL 1

            </div>


            <div class="level-title">

                FIND THE WISHES

            </div>


            <div class="heart-counter">

                ♡

                <span id="heartCount">

                    0

                </span>

                /3

            </div>


            <p class="level-instruction">

                SCAN THE AREA

            </p>


            <p class="level-description">

                Find the hidden wishes...

            </p>


            <button
                id="startARButton"
                type="button"
            >

                START AR

            </button>

        </div>

    </section>



    <!-- ===================================== -->
    <!-- AR SCREEN                             -->
    <!-- ===================================== -->

    <section
        id="ar-screen"
        class="hidden"
    >


        <!-- ================================= -->
        <!-- WEBGL CANVAS                      -->
        <!-- ================================= -->

        <canvas
            id="ar-canvas"
        ></canvas>



        <!-- ================================= -->
        <!-- AR UI                             -->
        <!-- ================================= -->

        <div id="ar-ui">


            <!-- ================================= -->
            <!-- TOP MESSAGE                        -->
            <!-- ================================= -->

            <div id="ar-message">

                SCAN THE GROUND

            </div>



            <!-- ================================= -->
            <!-- CENTER RETICLE                    -->
            <!-- ================================= -->

            <div id="placement-dot">

                +

            </div>



            <!-- ================================= -->
            <!-- PLACE BUTTON                      -->
            <!-- ================================= -->

            <button
                id="place-button"
                type="button"
            >

                TAP TO PLACE

            </button>


        </div>

    </section>



    <!-- ===================================== -->
    <!-- GAME JAVASCRIPT                       -->
    <!-- ===================================== -->

    <script src="script.js"></script>

</body>

</html>
